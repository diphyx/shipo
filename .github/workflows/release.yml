name: release

# A tag like v1.2.3, pushed by `make publish` (shipo releasing itself), in order: vet, lint and
# every test; a GitHub release with the binaries; then the Homebrew formula in diphyx/homebrew-tap.
# This is the only workflow: nothing runs on branch pushes or pull requests.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Vet for Windows
        env:
          GOOS: windows
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # The tests drive real git repositories; on Windows they run, but don't block the release.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint
        run: make lint

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # macOS, Linux, and Windows, on amd64 and arm64, into dist/.
      - name: Build the binaries
        run: .github/scripts/package.sh "$TAG"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" --generate-notes --verify-tag "${flags[@]}"

  # `brew install diphyx/tap/shipo`: rewrites Formula/shipo.rb in diphyx/homebrew-tap from the
  # release's checksums.txt. Prereleases are skipped; TAP_TOKEN is a fine-grained token with
  # Contents read and write on that repo, since github.token reaches only this one.
  tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: diphyx/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern checksums.txt --dir /tmp
          mkdir -p tap/Formula
          .github/scripts/formula.sh "$TAG" /tmp/checksums.txt > tap/Formula/shipo.rb

      - name: Push the formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shipo.rb
          git diff --cached --quiet && exit 0
          git commit -m "shipo $TAG"
          git push
