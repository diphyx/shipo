<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="publish runs push, then release, workflow and command, one by one; push has no prompt, the other three ask first">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4c0c7"/>
    </marker>
  </defs>

  <g font-size="12" font-weight="600" text-anchor="middle">
    <text x="105" y="34" fill="#8a9aa3">no prompt</text>
    <rect x="290" y="18" width="76" height="24" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.2"/>
    <text x="328" y="35" fill="#e8590c">Create?</text>
    <rect x="516" y="18" width="70" height="24" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.2"/>
    <text x="551" y="35" fill="#e8590c">Run?</text>
    <rect x="729" y="18" width="70" height="24" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.2"/>
    <text x="764" y="35" fill="#e8590c">Run?</text>
  </g>

  <g fill="#fff5ec" stroke="#e8590c" stroke-width="1.5">
    <rect x="20" y="58" width="170" height="76" rx="12"/>
    <rect x="243" y="58" width="170" height="76" rx="12"/>
    <rect x="466" y="58" width="170" height="76" rx="12"/>
    <rect x="689" y="58" width="151" height="76" rx="12"/>
  </g>

  <g font-size="16" font-weight="700" fill="#2b3f47" text-anchor="middle">
    <text x="105" y="91">push</text>
    <text x="328" y="91">release</text>
    <text x="551" y="91">workflow</text>
    <text x="764" y="91">command</text>
  </g>
  <g font-size="12" fill="#5e707a" text-anchor="middle">
    <text x="105" y="113">commit + tag, atomic</text>
    <text x="328" y="113">GitHub Release + files</text>
    <text x="551" y="113">waits for the CI run</text>
    <text x="764" y="113">your own commands</text>
  </g>

  <g stroke="#b4c0c7" stroke-width="1.5" fill="none" marker-end="url(#head)">
    <path d="M192 96 H239"/>
    <path d="M415 96 H462"/>
    <path d="M638 96 H685"/>
  </g>

  <text x="430" y="170" font-size="13" fill="#5e707a" text-anchor="middle">one by one · a failure stops the rest · a declined task is skipped</text>
</svg>
