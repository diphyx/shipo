<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="checks, version, bump and build run locally and are undone on failure; publish sends the release out and is never undone">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4c0c7"/>
    </marker>
  </defs>

  <g font-size="16" font-weight="700" fill="#2b3f47" text-anchor="middle">
    <rect x="20" y="40" width="128" height="72" rx="12" fill="#eef4ff" stroke="#2f6fde" stroke-width="1.5"/>
    <text x="84" y="72">checks</text>
    <rect x="188" y="40" width="128" height="72" rx="12" fill="#eef4ff" stroke="#2f6fde" stroke-width="1.5"/>
    <text x="252" y="72">version</text>
    <rect x="356" y="40" width="128" height="72" rx="12" fill="#eef4ff" stroke="#2f6fde" stroke-width="1.5"/>
    <text x="420" y="72">bump</text>
    <rect x="524" y="40" width="128" height="72" rx="12" fill="#eef4ff" stroke="#2f6fde" stroke-width="1.5"/>
    <text x="588" y="72">build</text>
    <rect x="712" y="40" width="128" height="72" rx="12" fill="#fff5ec" stroke="#e8590c" stroke-width="1.5"/>
    <text x="776" y="72">publish</text>
  </g>

  <g font-size="12" fill="#5e707a" text-anchor="middle">
    <text x="84" y="94">nothing changes</text>
    <text x="252" y="94">read it</text>
    <text x="420" y="94">write · commit · tag</text>
    <text x="588" y="94">make the files</text>
    <text x="776" y="94">send it out</text>
  </g>

  <g stroke="#b4c0c7" stroke-width="1.5" fill="none" marker-end="url(#head)">
    <path d="M150 76 H184"/>
    <path d="M318 76 H352"/>
    <path d="M486 76 H520"/>
    <path d="M654 76 H708"/>
  </g>

  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M20 134 V142 H652 V134" stroke="#2f6fde"/>
    <path d="M712 134 V142 H840 V134" stroke="#e8590c"/>
  </g>

  <g font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">
    <text x="336" y="166" fill="#2f6fde">LOCAL</text>
    <text x="776" y="166" fill="#e8590c">REMOTE</text>
  </g>
  <g font-size="12" fill="#5e707a" text-anchor="middle">
    <text x="336" y="184">undone on failure</text>
    <text x="776" y="184">never undone</text>
  </g>
</svg>
